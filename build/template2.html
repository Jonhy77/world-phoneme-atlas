<meta charset="utf-8">
<title>World Phoneme Atlas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gentium+Plus:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a working instrument. Header + tabs on top, one full-height scrolling chart per tab, detail drawer on the right. */
:root {
  --bg: #f3f5f2; --surface: #ffffff; --surface-2: #e9ede8; --ink: #17201c; --muted: #5a6660; --line: #d6ddd7;
  --accent: #1d6b57; --accent-soft: #d7ebe3; --variant: #9a6a12; --fix: #b4366a; --fix-soft: #f6dde8;
  --req: #1d6b57; --excl: #a83a2c;
  --tongue: #d97a86; --tongue-edge: #a84b58; --lip: #e3a3a3; --tissue: #e6b3b9; --skin: #f1e6df;
  --ipa: "Gentium Plus", "Charis SIL", "Doulos SIL", "Noto Serif", "Times New Roman", serif;
  --ui: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  --rh: 26px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f1412; --surface: #161c19; --surface-2: #1d2521; --ink: #e4ebe7; --muted: #94a19a; --line: #2a3430;
  --accent: #5cc3a4; --accent-soft: #1d3a31; --variant: #d9a84a; --fix: #f07aa8; --fix-soft: #3f1f2d;
  --req: #5cc3a4; --excl: #f08a7a; --tongue: #b85a68; --tongue-edge: #e08c99; --lip: #9c5f63; --tissue: #8a5059; --skin: #2b2523; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0f1412; --surface: #161c19; --surface-2: #1d2521; --ink: #e4ebe7; --muted: #94a19a; --line: #2a3430;
  --accent: #5cc3a4; --accent-soft: #1d3a31; --variant: #d9a84a; --fix: #f07aa8; --fix-soft: #3f1f2d;
  --req: #5cc3a4; --excl: #f08a7a; --tongue: #b85a68; --tongue-edge: #e08c99; --lip: #9c5f63; --tissue: #8a5059; --skin: #2b2523; color-scheme: dark }

[hidden] { display: none !important; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--ui); font-size: 14px; line-height: 1.45; }
.app { height: 100%; display: flex; flex-direction: column; padding-inline: 16px; box-sizing: border-box; }
header.top { padding-block: 16px 0; display: flex; flex-direction: column; gap: 10px; }
.titlebar { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 18px; }
h1 { font-family: var(--ipa); font-weight: 700; font-size: 1.9rem; margin: 0; letter-spacing: .005em; text-wrap: balance; }
h1 .slash { color: var(--accent); font-weight: 400; }
.sub { color: var(--muted); margin: 0; max-width: 70ch; }
.stats { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12.5px; color: var(--muted); }
.stats b { font-family: var(--mono); font-weight: 500; color: var(--ink); font-variant-numeric: tabular-nums; }
nav.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); overflow-x: auto; }
nav.tabs button { font: inherit; font-weight: 500; background: none; border: 0; color: var(--muted); padding: 8px 14px; cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
nav.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
button:focus-visible, select:focus-visible, input:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

main { flex: 1; min-height: 0; display: flex; flex-direction: column; padding-block: 10px 12px; }
.panel { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 10px; }
.controls { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.controls label { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
input[type="search"], select { font: inherit; font-size: 13px; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; }
input[type="search"] { width: 15rem; max-width: 100%; }
.btn { font: inherit; font-size: 12.5px; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 4px 9px; cursor: pointer; }
.btn:hover { border-color: var(--accent); }
.btn.swap { font-weight: 600; border-color: var(--accent); color: var(--accent); }
.btn.swap[aria-pressed="true"] { background: var(--accent); color: var(--surface); }
.chips { display: flex; flex-wrap: wrap; gap: 4px; }
.chip { font: inherit; font-size: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 999px; padding: 2px 9px; cursor: pointer; }
.chip[aria-pressed="false"] { color: var(--muted); background: transparent; text-decoration: line-through; text-decoration-color: var(--muted); }
.chip.req { border-color: var(--req); color: var(--req); }
.chip.excl { border-color: var(--excl); color: var(--excl); }
.chip .ipa { font-family: var(--ipa); font-size: 14px; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--muted); }
.legend span.k { display: inline-block; width: 1.3em; text-align: center; font-weight: 600; }
.count { font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }

/* play button */
.pl { all: unset; cursor: pointer; display: inline-grid; place-items: center; width: 18px; height: 18px; border-radius: 50%; font-size: 8px; line-height: 1; color: var(--accent); border: 1px solid currentColor; box-sizing: border-box; vertical-align: middle; padding-left: 1px; }
.pl:hover, .pl.on { background: var(--accent); color: var(--surface); }
.pl.w { border-style: dashed; }
.wbtn.on { background: var(--accent); color: var(--surface); }
.pl:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

.scroller { flex: 1; min-height: 240px; overflow: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; position: relative; }
table.grid { border-collapse: separate; border-spacing: 0; table-layout: fixed; font-variant-numeric: tabular-nums; }
.grid th, .grid td { padding: 0; height: var(--rh); border-bottom: 1px solid var(--line); text-align: center; overflow: hidden; white-space: nowrap; }
.grid thead th { position: sticky; background: var(--surface-2); z-index: 2; font-weight: 500; }
.grid td { font-size: 13px; }
.grid .a1::after { content: "✓"; color: var(--accent); font-weight: 700; }
.grid .a2::after { content: "✓"; color: var(--accent); opacity: .42; }
.grid .a3::after { content: "○"; color: var(--variant); font-size: 11px; }
.grid .a4 { background: var(--fix-soft); }
.grid .a4::after { content: "✓"; color: var(--fix); font-weight: 700; }
.grid .gs { border-left: 1px solid var(--line); }
.grid tbody tr:hover td { background: var(--accent-soft); }
.grid tbody tr:hover td.a4 { background: var(--fix-soft); }
.grid tr.sp td, .grid td.sp, .grid th.sp { border: 0; background: transparent; }
/* column hover: a translucent band over the hovered column, plus its header cell */
.colov { position: absolute; pointer-events: none; z-index: 0; background: color-mix(in srgb, var(--accent) 14%, transparent); }
.grid thead th.colhl { background: var(--accent-soft) !important; color: var(--accent); }

/* --- languages as rows (.lr) --- */
.lr thead tr.g th { top: 0; height: 22px; font-size: 11px; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); text-align: left; padding-left: 6px; border-left: 1px solid var(--line); }
.lr thead tr.g th.cg { cursor: pointer; }
.lr thead tr.g th.cg:hover { color: var(--accent); }
.lr thead tr.s th { top: 22px; height: 32px; font-family: var(--ipa); font-size: 16px; font-weight: 400; cursor: pointer; }
.lr thead tr.s th:hover { color: var(--accent); }
.lr thead tr.p th { top: 54px; height: 22px; }
.lr thead tr.s th.req { background: var(--accent-soft); color: var(--req); box-shadow: inset 0 -3px 0 var(--req); }
.lr thead tr.s th.excl { color: var(--excl); box-shadow: inset 0 -3px 0 var(--excl); text-decoration: line-through; }
.lr .ln { position: sticky; left: 0; z-index: 1; background: var(--surface); text-align: left; padding: 0 8px; border-right: 1px solid var(--line); cursor: pointer; }
.lr thead .ln { z-index: 3; background: var(--surface-2); vertical-align: bottom; padding-bottom: 8px; cursor: default; }
.lr td.ln:hover .nm { color: var(--accent); text-decoration: underline; }
.lr .nm { font-weight: 500; }
.lr .iso, .lr .rk { font-family: var(--mono); font-size: 11px; color: var(--muted); }
.lr .iso { margin-left: 6px; }
.lr .rk { display: inline-block; width: 2.2em; }
.lr td.meta { text-align: left; padding: 0 8px; font-size: 12px; color: var(--muted); text-overflow: ellipsis; }
.lr td.num { font-family: var(--mono); font-size: 12px; color: var(--muted); }
.lr td.colx { background: var(--surface-2); }

/* --- sounds as rows (.sr) --- */
.sr thead th { top: 0; height: 150px; vertical-align: bottom; }
.sr thead th.lh button { all: unset; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px; width: 100%; padding-bottom: 6px; box-sizing: border-box; }
.sr thead th.lh button:focus-visible { outline: 2px solid var(--accent); }
.sr thead th.lh .vn { writing-mode: vertical-rl; transform: rotate(180deg); font-size: 12.5px; font-weight: 500; max-height: 120px; overflow: hidden; text-overflow: ellipsis; }
.sr thead th.lh .rk { font-family: var(--mono); font-size: 10.5px; color: var(--muted); }
.sr thead th.lh.proxy .vn::after { content: " *"; color: var(--fix); }
.sr thead th.lh:hover .vn { color: var(--accent); }
.sr .sy { position: sticky; left: 0; z-index: 1; background: var(--surface); border-right: 1px solid var(--line); text-align: left; padding-left: 8px; }
.sr .sy .g { font-family: var(--ipa); font-size: 18px; display: inline-block; min-width: 2.2em; }
.sr td.sy.fl { cursor: pointer; }
.sr td.sy.fl:hover .g { color: var(--accent); }
.sr td.sy.req { box-shadow: inset 3px 0 0 var(--req); }
.sr td.sy.req .g { color: var(--req); }
.sr td.sy.excl { box-shadow: inset 3px 0 0 var(--excl); }
.sr td.sy.excl .g { color: var(--excl); text-decoration: line-through; }
.sr .ds { position: sticky; left: 80px; z-index: 1; background: var(--surface); text-align: left; padding: 0 8px; font-size: 12px; color: var(--muted); text-overflow: ellipsis; border-right: 1px solid var(--line); }
.sr .wf { font-family: var(--mono); font-size: 11.5px; color: var(--muted); text-align: right; padding-right: 8px; border-right: 1px solid var(--line); }
.sr thead .sy, .sr thead .ds { z-index: 3; background: var(--surface-2); font-size: 12px; color: var(--muted); text-align: left; padding-left: 8px; }
.sr thead .wf { font-size: 11px; text-align: right; }
.sr tr.grp th { position: sticky; top: 150px; z-index: 2; background: var(--bg); text-align: left; padding-left: 8px; font-size: 11px; letter-spacing: .05em; text-transform: uppercase; color: var(--ink); cursor: pointer; height: 24px; }
.sr tr.grp th.gl { left: 0; z-index: 3; }
.sr tr.grp td { position: sticky; top: 150px; z-index: 1; background: var(--bg); height: 24px; }
.sr tr.grp th .n { color: var(--muted); font-weight: 400; letter-spacing: 0; text-transform: none; margin-left: 8px; }
.sr tr.grp th .car { display: inline-block; width: 1em; color: var(--muted); }
.sr td.tn { font-family: var(--mono); font-size: 12px; }
.sr td.tn.a4n { background: var(--fix-soft); color: var(--fix); font-weight: 600; }
.sr tbody tr:hover td.sy, .sr tbody tr:hover td.ds { background: var(--accent-soft); }

/* method tab */
.doc { overflow: auto; overflow-x: hidden; flex: 1; min-height: 0; }
.doc article { max-width: 72ch; padding-block: 6px 40px; }
.doc h2 { font-family: var(--ipa); font-size: 1.35rem; margin: 1.4em 0 .4em; text-wrap: balance; }
.doc .ipa { font-family: var(--ipa); font-size: 1.08em; }
.doc table { border-collapse: collapse; font-size: 13px; margin: .6em 0; }
.doc td, .doc th { border-bottom: 1px solid var(--line); padding: 4px 10px 4px 0; text-align: left; vertical-align: top; }
.doc details summary { cursor: pointer; color: var(--accent); }
.fixlist li { margin-bottom: .5em; }
.fixlist .who { font-weight: 600; }

/* drawer */
#drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(460px, 100%); background: var(--surface); border-left: 1px solid var(--line); box-shadow: -12px 0 32px rgba(0,0,0,.12); z-index: 20; display: flex; flex-direction: column; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
#drawer .dh { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding: 16px 18px 10px; border-bottom: 1px solid var(--line); }
#drawer h2 { font-family: var(--ipa); font-size: 1.5rem; margin: 0; line-height: 1.15; }
#drawer .dmeta { font-size: 12.5px; color: var(--muted); margin-top: 4px; }
#drawer .dmeta a { color: var(--accent); }
#drawer .db { overflow: auto; padding: 12px 18px 28px; display: flex; flex-direction: column; gap: 14px; }
#drawer .kv { display: grid; grid-template-columns: max-content 1fr; gap: 3px 12px; font-size: 13px; margin: 0; }
#drawer .kv dt { color: var(--muted); }
#drawer .kv dd { margin: 0; min-width: 0; }
#drawer .kv dd b { font-family: var(--mono); font-weight: 500; }
#drawer .note { font-size: 13px; background: var(--surface-2); border-radius: 6px; padding: 8px 10px; }
#drawer .fix { font-size: 12.5px; background: var(--fix-soft); border-radius: 6px; padding: 8px 10px; }
#drawer .fix b { color: var(--fix); }
#drawer h3 { font-size: 11px; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); margin: 0 0 5px; font-weight: 600; }
#drawer .segs { display: flex; flex-wrap: wrap; gap: 4px; }
#drawer .sg { font: 400 17px var(--ipa); color: var(--ink); min-width: 1.6em; text-align: center; padding: 1px 6px; border: 1px solid var(--line); border-radius: 5px; background: var(--bg); position: relative; }
button.sg { cursor: pointer; }
button.sg:hover { border-color: var(--accent); }
#drawer .sg.m { border-style: dashed; color: var(--muted); }
#drawer .sg.f { border-color: var(--fix); color: var(--fix); background: var(--fix-soft); }
#drawer .sg.v { border-color: var(--variant); color: var(--variant); }
#drawer .sg.x { color: var(--muted); background: transparent; }
#drawer select { width: 100%; }
#drawer details.miss { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; display: block; }
#drawer details.miss summary { cursor: pointer; font-weight: 600; font-size: 13px; }
#drawer details.miss summary .n { color: var(--muted); font-weight: 400; }
#drawer details.miss[open] summary { margin-bottom: 10px; }
#drawer details.miss .mg { display: flex; flex-direction: column; gap: 10px; }
#drawer .bigsym { font: 400 2.6rem/1 var(--ipa); color: var(--accent); margin-bottom: 4px; display: flex; align-items: center; gap: 12px; }
#drawer .bigsym .pl { width: 28px; height: 28px; font-size: 11px; }
#drawer .back { all: unset; cursor: pointer; font-size: 12.5px; color: var(--accent); }
#drawer .back:hover { text-decoration: underline; }
#drawer ul.how { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 4px; font-size: 13.5px; }
#drawer .ex { font-size: 13.5px; }
#drawer .ex .ipa { font-family: var(--ipa); font-size: 1.1em; }
#drawer .langs { font-size: 13px; line-height: 1.6; }
#drawer .langs .no { color: var(--muted); }
#drawer .row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.artwrap { display: flex; flex-direction: column; gap: 6px; }
.artic { width: 100%; max-width: 440px; display: block; background: var(--bg); border-radius: 8px; border: 1px solid var(--line); }
.a-skin { fill: var(--skin); }
.a-air-cav { fill: var(--bg); }
.a-face { fill: none; stroke: var(--muted); stroke-width: 1.3; }
.a-cav { fill: none; stroke: var(--muted); stroke-opacity: .45; stroke-width: 1.2; }
.a-bone { fill: var(--surface-2); stroke: var(--muted); stroke-width: .9; }
.a-tooth { fill: var(--surface); stroke: var(--muted); stroke-width: .9; }
.a-vel { fill: none; stroke: var(--tissue); stroke-width: 7; stroke-linecap: round; }
.a-epi { fill: none; stroke: var(--tissue); stroke-width: 4; stroke-linecap: round; }
.a-tongue { fill: var(--tongue); stroke: var(--tongue-edge); stroke-width: 1; }
.a-lip { fill: var(--lip); stroke: var(--tongue-edge); stroke-width: .8; }
.a-lar { fill: none; stroke: var(--muted); stroke-width: 1; }
.a-fold { stroke: var(--fix); stroke-width: 2.4; stroke-linecap: round; fill: none; }
.a-ibox { fill: var(--surface); stroke: var(--line); }
.a-lab { font: 7.5px var(--ui); fill: var(--muted); }
.a-acc { fill: var(--accent); }
.a-air { stroke: var(--accent); stroke-width: 1.4; stroke-linecap: round; }
.a-turb { fill: var(--accent); }
.a-burst { fill: none; stroke: var(--accent); stroke-width: 1.2; }
.a-asp { font: italic 9px var(--ipa); fill: var(--accent); }
.a-in { fill: none; stroke: var(--accent); stroke-width: 1.4; }
.a-latair { fill: none; stroke: var(--accent); stroke-dasharray: 3 2; stroke-width: 1.2; }
.a-at { fill: none; stroke: var(--accent); stroke-width: 1; stroke-dasharray: 2 2; }
.cmp-pick { align-items: flex-end; }
.cmp-pick .lp { display: flex; flex-direction: column; align-items: stretch; gap: 3px; font-size: 11px; letter-spacing: .04em; text-transform: uppercase; }
.achips { display: flex; flex-wrap: wrap; gap: 4px; text-transform: none; letter-spacing: 0; }
.achip { display: inline-flex; align-items: center; gap: 2px; font-size: 13px; color: var(--ink); background: var(--accent-soft); border-radius: 999px; padding: 2px 4px 2px 10px; }
.achip button { all: unset; cursor: pointer; padding: 0 6px; color: var(--muted); font-size: 15px; line-height: 1; }
.achip button:hover { color: var(--excl); } .achip button:focus-visible { outline: 2px solid var(--accent); border-radius: 50%; }
.cmp-pick .lp input { width: 17rem; max-width: 70vw; font-size: 14px; }
.cmpScroll { flex: 1; min-height: 0; overflow: auto; display: flex; flex-direction: column; gap: 16px; padding-bottom: 24px; }
.cmp-sum { display: flex; flex-wrap: wrap; gap: 8px; }
.cmp-sum .t { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 8px 12px; min-width: 9.5rem; }
.cmp-sum .t b { display: block; font: 600 1.35rem var(--mono); font-variant-numeric: tabular-nums; }
.cmp-sum .t span { font-size: 12px; color: var(--muted); }
.cmp-sum .t.new { border-color: var(--fix); } .cmp-sum .t.new b { color: var(--fix); }
.cmp-sum .t.sim b { color: var(--variant); } .cmp-sum .t.same b { color: var(--accent); }
.cmp-h { font-family: var(--ipa); font-size: 1.25rem; margin: 0 0 6px; }
.cmp-sub { color: var(--muted); font-size: 13px; margin: 0 0 10px; max-width: 75ch; }
.prac { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 250px), 1fr)); gap: 8px; }
.prac .c { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 8px 10px; display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; align-items: center; }
.prac .c.sim { border-style: dashed; }
.symb { all: unset; cursor: pointer; font: 400 1.7rem/1.1 var(--ipa); color: var(--fix); grid-row: span 2; min-width: 1.6em; text-align: center; }
.prac .c.sim .symb { color: var(--variant); }
.symb:hover { text-decoration: underline; } .symb:focus-visible { outline: 2px solid var(--accent); }
.prac .d { font-size: 12.5px; min-width: 0; }
.prac .k { font-size: 12px; color: var(--muted); min-width: 0; }
.prac .k .ipa, .cmpt .ipa { font-family: var(--ipa); font-size: 1.15em; color: var(--ink); }
.cmpt { width: 100%; max-width: 760px; border-collapse: separate; border-spacing: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.cmpt th { position: sticky; top: 0; background: var(--surface-2); font-size: 12px; font-weight: 600; padding: 6px 10px; z-index: 1; }
.cmpt td { padding: 4px 10px; border-top: 1px solid var(--line); vertical-align: middle; }
.cmpt td.a { text-align: right; } .cmpt td.b { text-align: left; }
.cmpt td.m { text-align: center; width: 9.5rem; font-size: 11.5px; }
.cmpt tr.g td { background: var(--bg); font-size: 11px; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); padding-top: 8px; }
.sb { all: unset; cursor: pointer; font: 400 1.2rem var(--ipa); padding: 0 3px; border-radius: 4px; }
.sb:hover { background: var(--accent-soft); } .sb:focus-visible { outline: 2px solid var(--accent); }
.sb.x { color: var(--fix); font-weight: 700; }
.rel { display: inline-block; padding: 1px 8px; border-radius: 999px; border: 1px solid currentColor; white-space: nowrap; }
.rel.new { color: var(--fix); background: var(--fix-soft); } .rel.drop { color: var(--muted); } .rel.sim { color: var(--variant); } .rel.same { color: var(--accent); }

<script>
(() => {
const D = JSON.parse(document.getElementById('data').textContent);
const G = D.groups, SEGS = D.segs, COLS = D.cols, INV = D.inv, NC = COLS.length;
const TONE = G.indexOf('Tone'), DIPH = G.indexOf('Diphthong'), VOWEL = G.indexOf('Vowel'), CLICK = G.indexOf('Click');
const NL = D.nlang, AUD = D.audio || {}, ART = D.art, EX = D.ex || {}, SPK = D.speakers || {};
const colOfSeg = new Map(COLS.map((c, p) => [c[0], p]));
const fmtN = n => n >= 1e9 ? (n / 1e9).toFixed(n >= 1e10 ? 0 : 2).replace(/\.?0+$/, '') + 'B' : n >= 1e6 ? (n / 1e6).toFixed(n >= 1e8 ? 0 : 1).replace(/\.0$/, '') + 'M' : n >= 1e3 ? (n / 1e3).toFixed(n >= 1e5 ? 0 : 1).replace(/\.0$/, '') + 'K' : String(n);
const SRC = {
  ph: 'PHOIBLE (Moran et al.), mostly from JIPA Illustrations and grammars',
  ea: 'Eurasian Phonological Inventories (Nikolaev et al.)',
  er: 'Australian inventories (Round)',
  saphon: 'SAPhon, South American phonological inventories',
  aa: 'Alphabets of Africa (Chanard & Hartell)',
  ra: 'Indian languages (Ramaswami 1999)',
  spa: 'Stanford Phonology Archive (Crothers et al. 1979)',
  upsid: 'UPSID (Maddieson & Precoda 1990)'
};
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pct = n => { const p = 100 * n / NL; return p >= 10 ? p.toFixed(0) + '%' : p >= 1 ? p.toFixed(1) + '%' : p > 0 ? p.toFixed(2) + '%' : '0%'; };
const store = { get(k, d) { try { const v = localStorage.getItem('wpa:' + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
                set(k, v) { try { localStorage.setItem('wpa:' + k, JSON.stringify(v)); } catch {} } };

// ---------- audio: recordings are files published next to the page, decoded and played with Web Audio ----------
const WORDS = D.words || {};
let actx = null, curSrc = null;
const bufs = new Map();
const plb = s => AUD[s] ? `<button class="pl" data-play="${s}" aria-label="Play ${esc(SEGS[s][0])}" title="Play the sound ${esc(SEGS[s][0])}">▶</button>`
  : WORDS[s] ? `<button class="pl w" data-playw="${s}" aria-label="Play an example word with ${esc(SEGS[s][0])}" title="No isolated recording; plays the example word ${esc(WORDS[s][1])} (${esc(WORDS[s][0])})">▶</button>` : '';
async function playFile(url, btn) {
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') await actx.resume();
    document.querySelectorAll('.pl.on, .wbtn.on').forEach(b => b.classList.remove('on'));
    if (btn) btn.classList.add('on');
    let buf = bufs.get(url);
    if (!buf) { const r = await fetch(url); if (!r.ok) throw new Error(r.status); buf = await actx.decodeAudioData(await r.arrayBuffer()); bufs.set(url, buf); }
    if (curSrc) try { curSrc.stop(); } catch {}
    const src = actx.createBufferSource(); src.buffer = buf; src.connect(actx.destination);
    src.onended = () => { if (btn) btn.classList.remove('on'); };
    src.start(); curSrc = src;
  } catch (err) { if (btn) { btn.classList.remove('on'); btn.title = 'Could not load this recording'; } }
}
document.addEventListener('click', e => {
  const b = e.target.closest('[data-play], [data-playw]');
  if (!b) return;
  e.stopPropagation(); e.preventDefault();
  const btn = b.classList.contains('pl') || b.classList.contains('wbtn') ? b : null;
  if (b.dataset.play != null) { const a = AUD[+b.dataset.play]; if (a) playFile(a[0], btn); }
  else { const w = WORDS[+b.dataset.playw]; if (w) playFile(w[4], btn); }
}, true);

// ---------- per-inventory state ----------
// codes: 0 absent, 1 phoneme, 2 marginal, 3 only as a variant (e.g. pʰ without plain p), 4 added by a documented correction
const better = (a, b) => (!a ? b : (a === 2 && b !== 2) ? b : a);
const cache = new Map();
function invState(id) {
  if (cache.has(id)) return cache.get(id);
  if (!id || !INV[id]) { const e = { st: new Uint8Array(NC), seen: new Map(), tones: [], fixes: [], n: 0 }; cache.set(id, e); return e; }
  const st = new Uint8Array(NC), seen = new Map(), tones = [], fixes = [];
  const segs = INV[id][5];
  for (const s of segs) {
    const S = SEGS[s[1]];
    const flag = s[2] === 2 ? 4 : s[2] === 1 ? 2 : 1;
    seen.set(s[1], better(seen.get(s[1]), flag));
    if (s.length > 3) fixes.push(s);
    if (S[1] === TONE) { tones.push(s); continue; }
    for (const c of S[3]) st[c] = better(st[c], flag);
  }
  for (const s of segs) { const v = SEGS[s[1]][4]; if (v >= 0 && !st[v]) st[v] = 3; }
  const r = { st, seen, tones, fixes, n: segs.length };
  cache.set(id, r); return r;
}
const has = c => c === 1 || c === 2 || c === 4;

// current inventory per glottocode (shared by both tables)
const cur = {};
for (const L of D.langs) cur[L[2]] = L[5];
const TOP = D.top.map(t => ({ rank: t[0], name: t[1], l1: t[2], l2: t[3], total: t[4], inv: t[5], note: t[6], gc: t[8] || (t[5] ? INV[t[5]][3] : ''), proxy: t[1] === 'Western Punjabi', none: !t[5] }));
for (const t of TOP) if (!t.proxy && !t.none) cur[t.gc] = t.inv;
const topInv = {};
const invOfTop = t => t.none ? null : t.proxy ? (topInv[t.rank] || t.inv) : cur[t.gc];

// ---------- header stats & legends ----------
document.getElementById('stats').innerHTML =
  `<span><b>${NL.toLocaleString('en')}</b> languages with a documented inventory</span>` +
  `<span><b>${Object.keys(INV).length.toLocaleString('en')}</b> inventories</span>` +
  `<span><b>${NC}</b> sound columns</span>` +
  `<span><b>${Object.keys(AUD).length}</b> sound recordings · <b>${Object.keys(WORDS).length}</b> example words</span>` +
  `<span>Speaker ranking: Ethnologue 2026 (total L1 + L2)</span>`;
const legend = `<span><span class="k" style="color:var(--accent)">✓</span>phoneme</span>
  <span><span class="k" style="color:var(--accent);opacity:.42">✓</span>marginal (loans, rare)</span>
  <span><span class="k" style="color:var(--variant)">○</span>only as a variant (e.g. pʰ but no plain p)</span>
  <span><span class="k" style="color:var(--fix);background:var(--fix-soft)">✓</span>added by a documented correction</span>`;
document.getElementById('legend1').innerHTML = legend;
document.getElementById('legend2').innerHTML = legend;

// ---------- tooltip ----------
const tip = document.getElementById('tip');
const STATE_TXT = ['absent', 'phoneme', 'marginal phoneme', 'only as a variant', 'phoneme (added by correction)'];
function showTip(html, e) {
  tip.innerHTML = html; tip.hidden = false;
  const r = tip.getBoundingClientRect();
  let x = e.clientX + 14, y = e.clientY + 16;
  if (x + r.width > innerWidth - 8) x = e.clientX - r.width - 14;
  if (y + r.height > innerHeight - 8) y = e.clientY - r.height - 12;
  tip.style.left = Math.max(8, x) + 'px'; tip.style.top = Math.max(8, y) + 'px';
}
const hideTip = () => { tip.hidden = true; };
const uniq = a => a.filter((v, i) => a.indexOf(v) === i);
const variantsFor = (id, col) => uniq(INV[id][5].filter(s => SEGS[s[1]][4] === col).map(s => SEGS[s[1]][0]));
function cellTip(id, seg, col, c) {
  let h = STATE_TXT[c];
  if (c === 3) h += ` (has <span class="ipa">${variantsFor(id, col).map(esc).join(' ')}</span>)`;
  if (c && c !== 3) {
    const raw = uniq(col >= 0 ? INV[id][5].filter(s => SEGS[s[1]][3].includes(col)).map(s => s[0]) : INV[id][5].filter(s => s[1] === seg).map(s => s[0]));
    if (raw.length && !(raw.length === 1 && raw[0] === SEGS[seg][0])) h += `<br><span class="dim">source writes: </span><span class="ipa">${raw.map(esc).join(' ')}</span>`;
  }
  return h;
}
// ---------- merge variants (view option): a plain sound and its variants shown as one ----------
let merge = store.get('merge', false);
const FAM = new Map();  // root column -> member columns
COLS.forEach((c, p) => { const v = SEGS[c[0]][4]; const r = v >= 0 ? v : p; if (!FAM.has(r)) FAM.set(r, []); FAM.get(r).push(p); });
const ROOT_HAS_VAR = new Set(SEGS.filter(s => s[4] >= 0).map(s => s[4]));
const isRoot = p => SEGS[COLS[p][0]][4] < 0;
function mState(st, r) {
  let best = 0;
  for (const m of FAM.get(r) || [r]) { const c = st.st[m]; if (c && c !== 3) best = better(best, c); }
  if (!best && st.st[r] === 3) best = 1;
  return best;
}
const cellState = (st, p) => merge && FAM.has(p) ? mState(st, p) : st.st[p];
let MF = null;
function colFreq(p) {
  if (!merge || !FAM.has(p)) return COLS[p][1];
  if (!MF) { MF = new Array(NC).fill(0); const roots = [...FAM.keys()];
    for (const L of D.langs) { const st = invState(cur[L[2]]); for (const r of roots) if (mState(st, r)) MF[r]++; } }
  return MF[p];
}
const famMark = p => merge && p >= 0 && ROOT_HAS_VAR.has(p) ? '<span class="fm" title="variants merged">+</span>' : '';
function famPresent(id, r) { const mem = new Set(FAM.get(r) || [r]); return uniq(INV[id][5].filter(s => SEGS[s[1]][3].some(c => mem.has(c)) || mem.has(SEGS[s[1]][4])).map(s => SEGS[s[1]][0])); }
function cellTipM(id, seg, col, c) {
  if (merge && col >= 0 && FAM.has(col)) return c ? `has <span class="ipa">${famPresent(id, col).map(esc).join(' ')}</span>` : `no ${esc(SEGS[seg][0])} or variants of it`;
  return cellTip(id, seg, col, c);
}
const soundTip = (seg, freq) => `<span class="ipa">${esc(SEGS[seg][0])}</span> ${esc(SEGS[seg][2])}${merge && colOfSeg.has(seg) && ROOT_HAS_VAR.has(colOfSeg.get(seg)) ? ' <b>+ variants</b>' : ''}<br><span class="dim">${pct(freq)} of world languages${AUD[seg] ? ' · ▶ recording available' : ''}</span>`;

// ---------- tabs ----------
const tabs = [...document.querySelectorAll('nav.tabs button')];
function selectTab(btn) {
  for (const b of tabs) { b.setAttribute('aria-selected', b === btn); document.getElementById(b.dataset.p).hidden = b !== btn; }
  store.set('tab', btn.id);
  if (btn.id === 'tab-all') renderBig(true);
  if (btn.id === 'tab-cmp') renderCompare();
  if (btn.id === 'tab-glo') renderGlossary();
}
tabs.forEach(b => b.addEventListener('click', () => selectTab(b)));

function swapBtn(id, key, on, after) {
  const b = document.getElementById(id);
  b.setAttribute('aria-pressed', on);
  b.title = on ? 'Currently: languages across, sounds down' : 'Currently: sounds across, languages down';
  b.addEventListener('click', () => { const v = b.getAttribute('aria-pressed') !== 'true'; b.setAttribute('aria-pressed', v);
    b.title = v ? 'Currently: languages across, sounds down' : 'Currently: sounds across, languages down'; store.set(key, v); after(v); });
}

// ================= TOP 30 =================
// default: sounds down the side (.sr). Swapped: languages down the side (.lr).
let topSwapped = store.get('topSwap', false);
const topCollapsed = new Set(store.get('topCollapsed', []));
let topRows = [], topStates = [];
function buildTop() {
  topStates = TOP.map(t => invState(invOfTop(t)));
  const rows = new Map();
  COLS.forEach((c, p) => rows.set('c' + p, { col: p, seg: c[0] }));
  for (const st of topStates) for (const [s] of st.seen) {
    const S = SEGS[s];
    if (S[1] === TONE) continue;
    const isCol = S[3].length === 1 && COLS[S[3][0]][0] === s;
    if (!isCol && !(S[3].length && S[1] === CLICK)) rows.set('s' + s, { col: -1, seg: s });
  }
  topRows = [...rows.values()].sort((a, b) => SEGS[a.seg][5] - SEGS[b.seg][5]);
  topRows.forEach((r, i) => {
    r.i = i;
    r.raw = topStates.map(st => r.col >= 0 ? st.st[r.col] : (st.seen.get(r.seg) || 0));
  });
  refreshTopView();
  renderTop();
}
function refreshTopView() {
  for (const r of topRows) {
    r.hide = merge && (r.col >= 0 ? !isRoot(r.col) : SEGS[r.seg][4] >= 0);
    r.cells = r.col >= 0 && merge ? topStates.map(st => cellState(st, r.col)) : r.raw;
    r.any = r.cells.some(Boolean);
    r.freq = r.col >= 0 ? colFreq(r.col) : SEGS[r.seg][6];
  }
}
function topGroups() {  // visible rows grouped: [[groupIndex, rows[]], ...]
  const hide = document.getElementById('hideEmpty').checked;
  const out = [];
  for (const r of topRows) {
    if (r.hide || (hide && !r.any)) continue;
    const g = SEGS[r.seg][1];
    if (!out.length || out[out.length - 1][0] !== g) out.push([g, []]);
    out[out.length - 1][1].push(r);
  }

  <h2>What is in the tables</h2>
  <p>About 7,100 languages are spoken today. Only some have a published phoneme inventory. The largest curated collection of these is <a href="https://phoible.org" target="_blank" rel="noopener">PHOIBLE 2.0</a> (Moran &amp; McCloy, eds., 2019). It holds ${Object.keys(INV).length.toLocaleString('en')} inventories for ${NL.toLocaleString('en')} languages. The "All languages" table lists every one of those languages. Languages with no documented inventory are not shown, because there is nothing to check off for them.</p>
  <p>Language family and macroarea come from <a href="https://glottolog.org" target="_blank" rel="noopener">Glottolog</a>. The top-50 ranking is Ethnologue 2026 by total speakers (first plus second language), as reported on Wikipedia's "List of languages by total number of speakers".</p>
  <p>The <b>Compare</b> tab lines up two inventories for a learner: sounds are grouped with their variants (p, pʰ, pʷ…) so near-matches share a row, and every sound of the target language that your language lacks is listed with the closest sound you already know. "Closest" is a simple score over place, manner, voicing, vowel height, backness and rounding, so treat it as a hint.</p>
  <p>Both tables have a <b>⇄ Swap axes</b> button that swaps rows and columns. Open any language to see its full inventory and, under "Missing sounds", every sound column it lacks.</p>
  <h2>One inventory per language</h2>
  <p>Many languages have several inventories from different sources, and those sources sometimes analyse the same language differently. PHOIBLE does not choose a default, so each row uses one inventory picked by source, in this order: PHOIBLE's own transcriptions (mostly from JIPA Illustrations), then Eurasian, Australian, South American, African, Indian, SPA, and UPSID. Open any language to see and switch between its other inventories.</p>
  <p>For the top 50, I checked every candidate inventory by hand and picked the one that best describes the standard variety:</p>

  <h2>How sounds become columns</h2>

  <ul>
    <li>Every symbol on the official IPA chart has a column, even when few languages use it.</li>
    <li>Any other sound gets a column if at least ${D.thr} languages (1%) have it. This brings in aspiration, breathy voice, length, nasalization, labialization, palatalization and so on.</li>
    <li>Fine place detail is merged into the base symbol. Dental <span class="ipa">t̪</span>, apical <span class="ipa">t̺</span> and laminal <span class="ipa">t̻</span> all count as <span class="ipa">t</span>, the same way the IPA chart groups them. The source's exact transcription appears in the tooltips and in the language panel.</li>

    <li>A <span style="color:var(--variant)">○</span> means the language has a modified version of the sound but not the plain one. English, for example, has <span class="ipa">pʰ</span> and no plain <span class="ipa">p</span> in its source. This is the usual way sources write English /p/, so the ○ tells you the sound is there with aspiration.</li>

  <h2>Corrections</h2>
  <p>Some of the chosen top-50 inventories have clear omissions or one-off transcriptions. I fixed only those, each with a citation. They show as pink cells and pink chips in the language panel:</p>
  <ul class="fixlist">${fixRows.join('')}</ul>
  <p>Every other inventory is shown exactly as PHOIBLE records it, after the notation merging described above. PHOIBLE inventories are phonemic analyses by different authors, so two sources can disagree about the same language. That is analysis, not error, and the tables keep it.</p>
  <h2>Articulation diagrams</h2>
  <p>Click any sound to open its panel. The animated side view is generated in the page from the sound's place and manner of articulation, voicing, airstream and modifiers. It shows which articulator moves where, whether the soft palate is raised or lowered (air through the nose), what the vocal folds are doing (inset, seen from above), and where air flows, hisses or bursts. It is a teaching schematic, not a recording of real movement, so proportions and timing are simplified. The "How to make it" text is generated from the same features. The example words are verified native-speaker recordings (see Recordings below).</p>
  <h2>Language family &amp; ancestry</h2>
  <p>Each language panel has a collapsed "Language family &amp; ancestry" section with two views. The <b>family tree</b> is Glottolog's classification: the chain of subgroups from the family down to the language, plus its closest relatives (green ones have an inventory and open on click). It covers every language. The <b>descended from</b> chain comes from Wiktionary's language data and lists actual ancestor languages, such as Portuguese ← Old Galician-Portuguese ← Latin ← Old Latin ← Proto-Italic ← Proto-Indo-European. ${Object.keys(FAMD.anc).length.toLocaleString('en')} of the ${NL.toLocaleString('en')} languages have one. Many of these chains contain only reconstructed proto-languages, because no older written stage of the language is known. The two sources can disagree at the deepest levels: Glottolog, for example, does not accept Niger-Congo as a proven family, while Wiktionary lists Proto-Niger-Congo.</p>

  <h2>Recordings</h2>
  <p>The ▶ buttons play the reference recordings used on Wikipedia's IPA charts, hosted on Wikimedia Commons. ${Object.keys(AUD).length} sounds have one. Each recording is a phonetician producing the sound in isolation (consonants usually between vowels, as in [aCa]), so it shows the sound itself and not how a particular language pronounces it. Sounds without their own recording (most aspirated, long or nasalized variants) are never given the plain sound's recording instead.</p>
  <p>Every sound also gets an <b>example word</b> recorded by a native speaker, where one could be verified: ${Object.keys(WORDS).length} of the ${NC} sound columns have one. Each word was checked automatically against its Wiktionary entry: the entry must have a recording, and its IPA transcription for that language must contain the sound as a whole segment (so a word with [pʰ] does not count for plain [p], and long [tː] does not count for [t]). Where a sound has no isolated recording, its ▶ in the tables plays the example word instead (shown with a dashed button). The remaining sounds are rare variants for which no recorded, transcribed word exists in Wiktionary.</p>

  ['Lateral fricative', 'Lateral approximant', 1.2], ['Plosive', 'Tap/Flap', 1.5]];

  const asV = A => A[0] === 'C' && A[1].length === 1 && GLIDE_V[A[1][0][3]] ? ['V', [GLIDE_V[A[1][0][3]]], A[2]] : null;

  if (X[0] !== Y[0]) { const xv = asV(X), yv = asV(Y); if (xv && Y[0] === 'V') X = xv; else if (yv && X[0] === 'V') Y = yv; else return 99; extra = .5; }

    return extra + Math.abs(a[0] - b[0]) + 1.5 * Math.abs(a[1] - b[1]) + (a[2] !== b[2] ? 1.5 : 0) + (X[1].length !== Y[1].length ? 2 : 0) + modDiff(X[2], Y[2]); }

  const an = multi ? 'your languages' : aNames[0] || 'your languages', bn = nameOfGc(cmp.b);
  const side = gc => { const st = invState(cur[gc]); const m = new Map(); for (const [s, f] of st.seen) if (SEGS[s][1] !== TONE) m.set(s, f); return { m, st }; };
  // your side = union of every language you speak; remember which language has each sound
  const A = { m: new Map(), who: new Map(), st: { tones: [] } };

  ['Close / open', 'high / low', 'How high the tongue is. Close vowels like [i] and [u] have the tongue high and the jaw nearly closed; open vowels like [a] have it low and the mouth open. Close-mid, mid and open-mid lie in between.', ['i', 'e', 'ɛ', 'a']],

const segByDisp = new Map();
COLS.forEach(c => segByDisp.set(SEGS[c[0]][0], c[0]));
SEGS.forEach((s, i) => { if (!segByDisp.has(s[0])) segByDisp.set(s[0], i); });
const PLACE_MARKS = [[34, 106], [52, 109], [59, 97], [66, 84], [80, 77], [110, 69], [146, 73], [157, 103], [167, 130], [163, 184]];
const PLACE_LEG = ['bilabial', 'labiodental', 'dental', 'alveolar', 'postalveolar / retroflex', 'palatal', 'velar', 'uvular', 'pharyngeal', 'glottal'];
let gloFig = null;
const hl = (s, q) => { const e = esc(s); if (!q) return e; const i = s.toLowerCase().indexOf(q); return i < 0 ? e : esc(s.slice(0, i)) + '<mark>' + esc(s.slice(i, i + q.length)) + '</mark>' + esc(s.slice(i + q.length)); };
function renderGlossary() {
  const body = document.getElementById('gloBody');
  const q = document.getElementById('gq').value.trim().toLowerCase();
  let n = 0, h = '';
  for (const [sec, intro, items] of GLO) {
    const hit = items.filter(([t, aka, def]) => !q || (t + ' ' + aka + ' ' + def).toLowerCase().includes(q));
    if (!hit.length) continue;
    n += hit.length;
    h += `<section><h2>${esc(sec)}</h2>${intro ? `<p class="gi">${esc(intro)}</p>` : ''}<dl>${hit.map(([t, aka, def, ex]) => {
      const egs = ex.map(sym => { const k = segByDisp.has(sym) ? sym : sym.normalize('NFD'); return segByDisp.has(k) ? sb(segByDisp.get(k)) : `<span class="ipa">${esc(sym)}</span>`; }).join(' ');
      return `<dt>${hl(t, q)}${aka ? `<span class="aka">${hl(aka, q)}</span>` : ''}</dt><dd>${hl(def, q)}${egs ? `<span class="eg">Examples: ${egs}</span>` : ''}</dd>`; }).join('')}</dl></section>`;
  }
  if (!n) h = `<p class="gi">No terms match "${esc(q)}".</p>`;
  document.getElementById('gcount').textContent = q ? `${n} term${n === 1 ? '' : 's'}` : '';
  if (!body.querySelector('.fig')) {
    body.innerHTML = `<div class="gl-list"></div><aside class="fig"><div id="gloArt"></div><ol class="figl">${PLACE_LEG.map(p => `<li>${p}</li>`).join('')}</ol>
      <p class="gi">Places of articulation, front to back. Click any example symbol for its animation and recording.</p></aside>`;
    const schwa = segByDisp.get('ə');
    gloFig = Artic.mount(document.getElementById('gloArt'), ART[schwa], 'Vowel');
    gloFig.seek(0);
    const svg = document.querySelector('#gloArt svg');
    svg.querySelector('#aFx').insertAdjacentHTML('afterend', `<g>${PLACE_MARKS.map(([x, y], i) => `<circle class="mk" cx="${x}" cy="${y}" r="5"/><text class="mkt" x="${x}" y="${y + 2.3}" text-anchor="middle">${i + 1}</text>`).join('')}</g>`);
    svg.setAttribute('aria-label', 'Side view of the mouth with numbered places of articulation');
  }
  body.querySelector('.gl-list').innerHTML = h;
}
document.getElementById('gq').addEventListener('input', renderGlossary);

// ---------- column hover (rows already highlight via CSS) ----------
function colHover(table, scroller) {
  const ov = document.createElement('div'); ov.className = 'colov'; ov.hidden = true; scroller.appendChild(ov);
  let hdr = [], lastCell = null;
  const clear = () => { ov.hidden = true; hdr.forEach(h => h.classList.remove('colhl')); hdr = []; lastCell = null; };
  const SKIP = '.ln, .sy, .ds, .wf, .sp, .meta, .num';
  table.addEventListener('mousemove', e => {
    const cell = e.target.closest('td, th');
    if (!cell || cell.colSpan > 1 || cell.matches(SKIP) || cell.closest('tr.grp, tr.sp, tr.g')) return clear();
    if (cell === lastCell) return;
    lastCell = cell;
    const sr = scroller.getBoundingClientRect(), r = cell.getBoundingClientRect(), tr = table.getBoundingClientRect();
    ov.style.left = (r.left - sr.left - scroller.clientLeft + scroller.scrollLeft) + 'px'; ov.style.width = r.width + 'px';
    ov.style.top = (tr.top - sr.top - scroller.clientTop + scroller.scrollTop) + 'px'; ov.style.height = tr.height + 'px'; ov.hidden = false;
    const cx = r.left + r.width / 2;
    hdr.forEach(h => h.classList.remove('colhl'));
    hdr = table.tHead ? [...table.tHead.querySelectorAll('th')].filter(h => h.colSpan === 1 && !h.matches(SKIP) && !h.closest('tr.g') &&
      (b => b.left <= cx && b.right >= cx)(h.getBoundingClientRect())) : [];
    hdr.forEach(h => h.classList.add('colhl'));
  });
  table.addEventListener('mouseleave', clear);
  scroller.addEventListener('scroll', () => { lastCell = null; }, { passive: true });
}
colHover(document.getElementById('topt'), document.getElementById('topScroll'));
colHover(bigT, bigS);

buildTop();
buildDoc();
filterBig();
const t0 = document.getElementById(store.get('tab', 'tab-top'));
if (t0) selectTab(t0);
})();
